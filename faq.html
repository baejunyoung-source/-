<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FAQ - 배준영의 사진 모음집</title>
    <style>
        body{
            width: 960px;
            margin: 0 auto;
            background: rgb(87,42,131);
            font-family: '맑은 고딕','Malgun Gothic','Gothic',sans-serif;
            color: #333;
        }
        #page-wrapper{
            background: #fff;
            margin: 40px 0;
            padding: 20px 30px;
            border-radius: 5px;
            box-shadow: 0 8px 6px rgba(219, 13, 13, 0.3);
        }
        h1{
            font-size: 28px;
            margin-bottom: 20px;
            color: rgb(60,60,60);
        }
        .faq-item{
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #f7f7f7;
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
        }
        .faq-question{
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .faq-answer{
            display: none;
            padding-left: 10px;
            line-height: 1.6em;
        }
    </style>
</head>
<body>
    <div id="page-wrapper">
        <a href="index.html" style="display:inline-block; padding:8px 16px; background:#4a2c8c; color:white; border-radius:6px; font-size:16px; font-weight:600; text-decoration:none; margin-bottom:15px;">Home</a>
        <h1>자주 묻는 질문 (FAQ)</h1>
        <p>사이트 이용 중 자주 묻는 질문들을 정리해두었습니다.</p>

        <div class="faq-item">
            <div class="faq-question">Q. 좋아요한 사진은 어디서 볼 수 있나요?</div>
            <div class="faq-answer">A. 상단 메뉴의 "My Likes" 페이지에서 확인할 수 있습니다.</div>
        </div>

        <div class="faq-item">
            <div class="faq-question">Q. 사진 업로드 기능은 있나요?</div>
            <div class="faq-answer">A. 현재는 지원하지 않지만, 추후 업데이트될 예정입니다.</div>
        </div>

        <div class="faq-item">
            <div class="faq-question">Q. 사진은 직접 촬영하신 건가요?</div>
            <div class="faq-answer">A. 네, 모든 사진은 배준영 님이 직접 촬영한 개인 작품입니다.</div>
        </div>

        <div class="faq-item">
            <div class="faq-question">Q. 좋아요 기능은 어떻게 동작하나요?</div>
            <div class="faq-answer">A. 각 게시글의 사진 아래 "좋아요" 버튼을 눌러 기록됩니다.</div>
        </div>

    </div>

    <script>
    const questions = document.querySelectorAll('.faq-question');
    questions.forEach(q => {
        q.addEventListener('click', function(){
            const answer = this.nextElementSibling;
            answer.style.display = (answer.style.display === 'block') ? 'none' : 'block';
        });
    });
</script>
</body>
</html>
