<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Nature Gallery - 배준영의 사진 모음집</title>
    <style>
        body{
            width: 960px;
            margin: 0 auto;
            font-family: '맑은 고딕','Malgun Gothic',sans-serif;
            background-color: #f3f5f7;
        }

        header{
            padding: 30px 0;
            text-align: center;
        }
        header h1{
            font-size: 32px;
            color: #2a3ab4;
            margin-bottom: 5px;
        }
        header p{
            font-size: 15px;
            color: #777;
        }

        .home-btn{
            display: inline-block;
            padding: 10px 20px;
            margin-bottom: 25px;
            background: #2a3ab4;
            color: white;
            border-radius: 20px;
            font-size: 15px;
            text-decoration: none;
            transition: 0.3s;
        }
        .home-btn:hover{
            background: #1d2a80;
            transform: scale(1.05);
        }

        .gallery-container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-item{
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.3s;
        }
        .gallery-item:hover{
            transform: scale(1.03);
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
        }

        .gallery-item img{
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .gallery-title{
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .gallery-info{
            padding: 0 10px 15px 10px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>자연 갤러리 (Nature Gallery)</h1>
        <p>자연 풍경 사진 모음</p>
        <a href="index.html" class="home-btn">← Home으로 돌아가기</a>
    </header>
    <div class="gallery-container">
        <div class="gallery-item">
            <img src="C:\웹표준기술\웹표준과제\pictures\KakaoTalk_20251218_161351479_02.jpg" alt="자연 사진 1">
            <div class="gallery-title">겨울 산책</div>
            <div class="gallery-info">2024.01.10</div>
        </div>

        <div class="gallery-item">
            <img src="C:\웹표준기술\웹표준과제\pictures\KakaoTalk_20251218_161351479_03.jpg" alt="자연 사진 2">
            <div class="gallery-title">맑은 호수</div>
            <div class="gallery-info">2024.09.02</div>
        </div>

        <div class="gallery-item">
            <img src="C:\웹표준기술\웹표준과제\pictures\KakaoTalk_20251218_161351479_04.jpg" alt="자연 사진 3">
            <div class="gallery-title">한강 아침</div>
            <div class="gallery-info">2024.09.21</div>
        </div>

        <div class="gallery-item">
            <img src="C:\웹표준기술\웹표준과제\pictures\KakaoTalk_20251218_161351479_05.jpg" alt="자연 사진 4">
            <div class="gallery-title">바람이 부는 들판</div>
            <div class="gallery-info">2024.08.18</div>
        </div>
    </div>
</body>
</html>
