<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2025년 11월 아카이브 - 배준영의 사진 모음집</title>
    <style>
        body{
            width: 960px;
            margin: 0 auto;
            background-color: #f3f5f7;
            font-family: '맑은 고딕','Malgun Gothic',sans-serif;
        }

        header{
            text-align: center;
            padding: 35px 0;
        }
        header h1{
            font-size: 30px;
            color: #2a3ab4;
        }
        header p{
            color:#555;
            font-size: 15px;
        }

        .home-btn{
            display: inline-block;
            padding: 10px 20px;
            margin-top: 15px;
            background: #2a3ab4;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: 0.3s;
        }
        .home-btn:hover{
            background: #1d2a80;
            transform: scale(1.05);
        }

        .archive-container{
            margin-top: 30px;
        }

        .archive-card{
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            transition: 0.3s;
        }
        .archive-card:hover{
            transform: scale(1.01);
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
        }

        .archive-thumbnail{
            width: 180px;
            height: 130px;
            border-radius: 8px;
            object-fit: cover;
        }

        .archive-text h2{
            margin: 0;
            font-size: 20px;
            color: #222;
        }
        .archive-date{
            color: #666;
            margin: 6px 0;
            font-size: 14px;
        }
        .archive-desc{
            font-size: 14px;
            color: #444;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <header>
        <h1>2025년 11월 아카이브</h1>
        <p>11월에 기록한 사진과 글 목록입니다.</p>
        <a href="index.html" class="home-btn">← Home</a>
    </header>
    <div class="archive-container">
        <div class="archive-card">
            <img src="pictures\KakaoTalk_20251218_160758951_05.jpg" class="archive-thumbnail">
            <div class="archive-text">
                <h2>어느 날의 오후</h2>
                <div class="archive-date">2025년 11월 9일</div>
                <div class="archive-desc">
                    독특한 공간이 주는 신비함을 담고자 했습니다.
                </div>
            </div>
        </div>
        
        <div class="archive-card">
            <img src="pictures\KakaoTalk_20251218_160758951_06.jpg" class="archive-thumbnail">
            <div class="archive-text">
                <h2>비가 갠 후</h2>
                <div class="archive-date">2025년 11월 18일</div>
                <div class="archive-desc">
                    고요하면서도 감성적인 도시의 분위기가 인상 깊었습니다.
                </div>
            </div>
        </div>
        
        <div class="archive-card">
            <img src="pictures\KakaoTalk_20251218_160758951.jpg" class="archive-thumbnail">
            <div class="archive-text">
                <h2>찬바람</h2>
                <div class="archive-date">2025년 11월 27일</div>
                <div class="archive-desc">
                    쓸쓸함이 느껴지는 사진.
                </div>
            </div>
        </div>
        
        <div class="archive-card">
            <img src="pictures\KakaoTalk_20251218_160758951_04.jpg" class="archive-thumbnail">
            <div class="archive-text">
                <h2>겨울의 시작</h2>
                <div class="archive-date">2025년 11월 30일</div>
                <div class="archive-desc">
                    산 위에서 내려다본 풍경입니다. 
                </div>
            </div>
        </div>
    </div>
</body>
</html>
