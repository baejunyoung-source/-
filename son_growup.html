<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아들 성장일기 - 배준영의 사진 모음집</title>
    <style>
        body{
            width: 960px;
            margin: 0 auto;
            font-family: '맑은 고딕','Malgun Gothic',sans-serif;
            background-color: #f3f5f7;
        }

        header{
            text-align: center;
            padding: 35px 0;
        }
        header h1{
            font-size: 32px;
            color: #2a3ab4;
            margin-bottom: 5px;
        }
        header p{
            font-size: 15px;
            color: #666;
        }

        .home-btn{
            display: inline-block;
            padding: 10px 20px;
            margin-bottom: 25px;
            background: #2a3ab4;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: 0.3s;
        }
        .home-btn:hover{
            background: #1d2a80;
            transform: scale(1.05);
        }

        .growup-container{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .growup-card{
            background: white;
            border-radius: 12px;
            padding-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            overflow: hidden;
            transition: 0.3s;
        }
        .growup-card:hover{
            transform: scale(1.02);
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
        }

        .growup-card img{
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .grow-title{
            padding: 10px 15px 0 15px;
            font-weight: bold;
            font-size: 18px;
        }
        .grow-info{
            padding: 5px 15px;
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>아들 성장일기</h1>
        <p>아들의 소중한 순간들을 기록합니다</p>
        <a href="index.html" class="home-btn">← Home</a>
    </header>
    <div class="growup-container">
        <div class="growup-card">
            <img src="pictures\KakaoTalk_20251218_160551452_01.jpg" alt="아기 사진">
            <div class="grow-info">
                처음으로 목줄을 맨 순간을 기록한 사진입니다.
            </div>
        </div>

        <div class="growup-card">
            <img src="pictures\KakaoTalk_20251218_160551452_02.jpg" alt="아이 웃는 사진">
            <div class="grow-info">
                생일을 맞아 촬영한 사진으로, 호기심 가득한 표정이 인상적이었습니다.
                매년 조금씩 달라지는 모습이 소중한 순간입니다.
            </div>
        </div>

        <div class="growup-card">
            <img src="pictures\KakaoTalk_20251218_160551452_03.jpg">
            <div class="grow-info">
                카페에 가기 전, 잠시 안겨 있던 순간을 담았습니다.
            </div>
        </div>

        <div class="growup-card">
            <img src="pictures\KakaoTalk_20251218_160551452.jpg">
            <div class="grow-info">
                여행 중 자연스럽게 찍은 사진입니다.
                편안하고 행복했던 분위기를 그대로 담고 있습니다.
            </div>
        </div>
    </div>
</body>
</html>
